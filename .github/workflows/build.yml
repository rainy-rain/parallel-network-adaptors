name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            label: windows-x64
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            label: macos-arm64
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            label: macos-x64

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Approve esbuild build script
        working-directory: desktop
        run: pnpm rebuild esbuild
        continue-on-error: true

      - name: Download caddy (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: desktop/resources
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 --connect-timeout 30 `
            -o caddy.exe "https://caddyserver.com/api/download?os=windows&arch=amd64"
          $len = (Get-Item caddy.exe).Length
          if ($len -lt 5MB) { throw "caddy.exe 下载不完整：$len 字节" }
          Write-Host "caddy.exe $len 字节"

      - name: Download caddy (macOS)
        if: matrix.platform == 'macos-latest'
        working-directory: desktop/resources
        run: |
          ARCH=$([[ "${{ matrix.args }}" == *"aarch64"* ]] && echo "arm64" || echo "amd64")
          curl -L --fail --retry 3 --connect-timeout 30 \
            -o caddy.zip "https://caddyserver.com/api/download?os=darwin&arch=${ARCH}"
          unzip -o caddy.zip -d caddy-bin
          rm -f caddy.zip
          find caddy-bin -type f -name 'caddy*' -exec mv {} ./caddy \;
          rm -rf caddy-bin
          chmod +x caddy
          ls -lh caddy

      - name: Build Tauri app
        working-directory: desktop
        run: pnpm tauri build ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          if-no-files-found: warn
          path: |
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/macos/*.app.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: false
